name: Atelier CI/CD

on:
  push:
  workflow_dispatch:

env:
  IMAGE_NAME: atelier-flask

jobs:
  # ---------------------------------------------------------------
  # JOB 1 - Intégration continue : tester l'application
  # ---------------------------------------------------------------
  # Objectif : à chaque push, l'application doit être testée.
  # Si un test échoue, le pipeline doit s'arrêter ici.
  #
  # Étapes à écrire :
  #   1. Récupérer le code du dépôt       -> action actions/checkout@v4
  #   2. Installer Python 3.12            -> action actions/setup-python@v5
  #   3. Installer les dépendances        -> pip install -r requirements.txt  (+ pytest)
  #   4. Lancer les tests                 -> pytest -v tests/
  Tests:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Lancer les tests
        run: pytest -v tests/

  # ---------------------------------------------------------------
  # JOB 2 - Livraison continue : construire l'image Docker
  # ---------------------------------------------------------------
  # Objectif : si les tests passent, construire l'image Docker de
  # l'application (pensez à compléter le fichier Dockerfile !).
  #
  # Étapes à écrire :
  #   1. Récupérer le code du dépôt
  #   2. Construire l'image                -> docker build -t $IMAGE_NAME:${{ github.sha }} .
  #   3. Exporter l'image dans un fichier  -> docker save ... -o image.tar
  #   4. Transmettre le fichier au job 3   -> action actions/upload-artifact@v4
  #
  # Pourquoi l'étape 3 et 4 ? Chaque job tourne sur une machine neuve :
  # l'image construite ici n'existe pas sur la machine du job 3.
  Docker:
    runs-on: ubuntu-latest
    needs: Tests
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Construire l'image
        run: docker build -t "$IMAGE_NAME:${{ github.sha }}" .

      - name: Analyser les couches et la taille (Séance 2)
        run: |
          docker image ls "$IMAGE_NAME"
          docker history "$IMAGE_NAME:${{ github.sha }}"

      - name: Exporter l'image dans un fichier
        run: docker save "$IMAGE_NAME:${{ github.sha }}" -o image.tar

      - name: Transmettre l'image au job Production
        uses: actions/upload-artifact@v4
        with:
          name: image-docker
          path: image.tar
          retention-days: 1

  # ---------------------------------------------------------------
  # JOB 3 - Déploiement continu : simulation de mise en production
  # ---------------------------------------------------------------
  # Objectif : "déployer" l'image et vérifier que l'application répond.
  #
  # Étapes à écrire :
  #   1. Récupérer l'image du job 2        -> action actions/download-artifact@v4
  #   2. Charger l'image dans Docker       -> docker load -i image.tar
  #   3. Démarrer le conteneur             -> docker run -d -p 4000:4000 ...
  #   4. Vérifier que l'application répond -> curl http://localhost:4000/
  #      (attention : l'application met quelques secondes à démarrer)
  #   5. Afficher un message de succès dans le résumé du pipeline
  #      -> echo "..." >> $GITHUB_STEP_SUMMARY
  Production:
    runs-on: ubuntu-latest
    needs: Docker
    environment: production
    steps:
      - name: Récupérer l'image du job Docker
        uses: actions/download-artifact@v4
        with:
          name: image-docker

      - name: Charger l'image dans Docker
        run: docker load -i image.tar

      - name: Démarrer le conteneur
        run: docker run -d --name app -p 4000:4000 "$IMAGE_NAME:${{ github.sha }}"

      - name: Vérifier que l'application répond
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4000/ > page.html; then
              echo "Application en ligne après ${i} s"
              grep -q "Functions" page.html
              exit 0
            fi
            sleep 1
          done
          echo "L'application ne répond pas" >&2
          docker logs app
          exit 1

      - name: Résumé de la mise en production
        run: |
          {
            echo "## ✅ Mise en production réussie"
            echo ""
            echo "- Image : \`$IMAGE_NAME:${{ github.sha }}\`"
            echo "- Taille : $(docker image ls "$IMAGE_NAME:${{ github.sha }}" --format '{{.Size}}')"
            echo "- Utilisateur du conteneur : \`$(docker exec app whoami)\`"
            echo "- L'application répond sur le port 4000"
          } >> "$GITHUB_STEP_SUMMARY"